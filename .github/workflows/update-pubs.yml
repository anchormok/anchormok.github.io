name: Auto-update publications

# Daily at 01:00 UTC (09:00 Beijing) + manual trigger from the Actions tab.
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet requests scholarly

      - name: Run publication updater
        run: python scripts/update_pubs.py

      - name: Commit & push changes
        run: |
          if git diff --quiet -- data/live.json; then
            echo "No changes to publish."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/live.json
            git commit -m "chore: auto-update publications data [skip ci]"
            git push
          fi
